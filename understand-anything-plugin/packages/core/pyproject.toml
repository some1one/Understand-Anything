[project]
name = "understand-anything-core"
version = "0.1.0"
description = "The Understand-Anything Python engine: deterministic analysis (project scanning, import resolution, structural extraction, batching, graph assembly, fingerprints, auto-update) plus the graph view-model, schema/search, and the chat/diff/explain/onboard skill builders."
authors = [
    { name = "Justin Phillips", email = "justin.phillips@trucesoftware.com" },
]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "networkx>=3.6",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "jsonschema>=4.26.0",
    "pathspec>=1.1.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["understand_core/", "skill_builders/"]
excludes = ["tests", "**/__pycache__", "**/*.pyc"]

[tool.pdm.scripts]
# Deterministic analysis pipeline (formerly the arch_analysis package).
analyze = { cmd = "python -m understand_core.analyze", help = "Run architecture analysis: analyze <input.json> <results.json>" }
scan = { cmd = "python -m understand_core.scan_project", help = "Scan a project: scan <project_root> <output.json>" }
import-map = { cmd = "python -m understand_core.extract_import_map", help = "Resolve internal imports: import-map <input.json> <output.json>" }
structure = { cmd = "python -m understand_core.extract_structure", help = "Extract file structure: structure <input.json> <output.json>" }
batches = { cmd = "python -m understand_core.compute_batches", help = "Compute analysis batches: batches <project_root> [--changed-files PATH]" }
merge-batches = { cmd = "python -m understand_core.merge_batch_graphs", help = "Merge batch graph fragments: merge-batches <project_root>" }
merge-subdomains = { cmd = "python -m understand_core.merge_subdomain_graphs", help = "Merge subdomain graphs: merge-subdomains <project_root> [files...]" }
domain-context = { cmd = "python -m understand_core.extract_domain_context", help = "Extract domain context: domain-context <project_root> [--output PATH]" }
validate-graph = { cmd = "python -m understand_core.validate_graph", help = "Validate an assembled graph: validate-graph <graph.json> <review.json>" }
validate-domain-graph = { cmd = "python -m understand_core.validate_domain_graph", help = "Validate a domain graph: validate-domain-graph <domain-graph.json>" }
validate-assembled-graph = { cmd = "python -m understand_core.validate_assembled_graph", help = "Validate the pre-layer assembled graph: validate-assembled-graph <graph.json> <review.json> [--scan-result PATH]" }
assemble-scan = { cmd = "python -m understand_core.assemble_project_scan_result", help = "Assemble scan-result.json: assemble-scan <project-root> <narrative.json>" }
prepare-batch = { cmd = "python -m understand_core.prepare_file_analysis_batch", help = "Prepare file-analyzer batch input/context: prepare-batch <project-root> <batchIndex>..." }
validate-structure-output = { cmd = "python -m understand_core.validate_structure_output", help = "Validate extract_structure output: validate-structure-output <input.json> <results.json>" }
seed-file-batch = { cmd = "python -m understand_core.seed_file_batch_graph", help = "Seed deterministic file-batch graph: seed-file-batch <context.json> <results.json> <seed.json>" }
finalize-file-batch = { cmd = "python -m understand_core.finalize_file_batch_output", help = "Finalize file-batch output: finalize-file-batch <project-root> <context.json> <seed.json> <draft.json>" }
auto-update-preflight = { cmd = "python -m understand_core.auto_update_preflight", help = "Auto-update pre-flight: auto-update-preflight <project-root> [--force]" }
auto-update-fingerprint-check = { cmd = "python -m understand_core.auto_update_fingerprint_check", help = "Auto-update fingerprint check: auto-update-fingerprint-check <project-root>" }
auto-update-prepare-batches = { cmd = "python -m understand_core.auto_update_prepare_batches", help = "Auto-update batch prep: auto-update-prepare-batches <project-root>" }
auto-update-apply-batches = { cmd = "python -m understand_core.auto_update_apply_batches", help = "Auto-update prune+merge: auto-update-apply-batches <project-root>" }
auto-update-finalize = { cmd = "python -m understand_core.auto_update_finalize", help = "Auto-update finalize: auto-update-finalize <project-root>" }

[tool.pytest.ini_options]
# packages/core is on sys.path so `import understand_core` / `import skill_builders`
# and `python -m understand_core.*` resolve.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
